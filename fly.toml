# Fly.io config for the full-stack demo (examples/fullstack).
#   fly launch --no-deploy --copy-config --name <app>   # once
#   fly volumes create support_desk_data --size 1        # once
#   fly deploy
app = "eipagent-support-desk"
primary_region = "iad"

[build]
  dockerfile = "examples/fullstack/Dockerfile"

[env]
  PORT = "8080"

[mounts]
  source = "support_desk_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
